workflows:
  ios-release:
    name: Midnight Garage - iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: app_store_credentials
    environment:
      # Configure in Codemagic UI → Team settings → Code signing identities,
      # or via an App Store Connect API key integration (Teams → Integrations
      # → App Store Connect) — either lets `xcode-project use-profiles` pull
      # certs/profiles automatically without ever touching Xcode's signing UI.
      # app_store_credentials below is the integration/group name you
      # actually create there — a placeholder name, not Codemagic-reserved.
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "app.midnightgarage"
      node: latest
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      # --ignore-scripts: sharp (pulled in by the @capacitor/assets dev
      # dependency, used only by the local `npm run icons` tool — never
      # invoked in this pipeline) is the one package in the lockfile with
      # an install script; it fetches a prebuilt native binary from GitHub
      # releases at install time, which Codemagic's build network blocks.
      # Skipping install scripts avoids that fetch entirely — nothing this
      # pipeline runs needs a compiled native addon.
      - name: Install npm dependencies
        script: npm ci --ignore-scripts

      - name: Build the web app (release — strips admin mode)
        script: npm run build:release

      # ios/ is committed to this repo (not gitignored — see .gitignore's
      # comment) precisely because it carries hand-maintained native config
      # (Info.plist keys, AppDelegate.swift's AVAudioSession setup,
      # PrivacyInfo.xcprivacy's Xcode-project membership) that a fresh
      # `cap add ios` would silently discard. Sync, never re-add.
      - name: Capacitor sync (copies www/ into ios/App/App/public + updates plugins)
        script: npx cap sync ios

      - name: CocoaPods install
        script: |
          cd ios/App && pod install

      # Must run before "Fetch signing files" so there's an initialized
      # keychain ready to receive whatever certificate that step produces.
      - name: Set up keychain to be used for code signing
        script: keychain initialize

      # `xcode-project use-profiles` below only *applies* profiles that are
      # already sitting on the build machine — it doesn't fetch them. These
      # two steps are what actually pull (or create, if none exist yet for
      # $BUNDLE_ID) a distribution certificate + provisioning profile from
      # the App Store Connect API key integration referenced above, and
      # install the certificate into the build keychain. Skipping them is
      # why an earlier version of this pipeline failed archiving with
      # "requires a provisioning profile" — use-profiles had nothing to work with.
      #
      # --create requires a private key to generate the CSR for the new
      # certificate. Without it, this step creates the certificate on
      # Apple's side successfully but has no key to save it with locally,
      # and fails with "Cannot save Signing Certificates without certificate
      # private key" — a keychain-initialize/API-key-role problem this is
      # NOT; both were red herrings the first two times this error showed up.
      #
      # CERTIFICATE_PRIVATE_KEY (set in the app_store_credentials group, NOT
      # committed anywhere) is base64 — same convention as CM_KEYSTORE in
      # the android-release workflow below — decoded here rather than
      # passed as a raw multi-line PEM env var, since a PEM's exact line
      # breaks are easy to lose when pasting into an env var field
      # (particularly on mobile), and --certificate-key rejects a value
      # that doesn't parse as a valid key with a plain argparse error.
      # --certificate-key takes the key's actual string content, not a
      # file path — no "@file:"-style prefix support in this CLI version,
      # despite that being documented for some other flags/tools.
      # See docs/CI-SETUP.md for how to generate and set that variable.
      - name: Fetch signing files
        script: |
          DECODED_KEY=$(echo $CERTIFICATE_PRIVATE_KEY | base64 --decode)
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "$DECODED_KEY" \
            --create

      - name: Set up signing certificate
        script: keychain add-certificates

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      - name: Increment build number to latest TestFlight build + 1
        script: |
          cd ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))

      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # Uploads to TestFlight automatically. submit_to_app_store additionally
      # submits for App Review the moment a build finishes — leave that off
      # until you've actually run a TestFlight pass; flip it on deliberately,
      # don't let a routine push silently submit to Apple.
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-release:
    name: Midnight Garage - Android Release
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      groups:
        - google_play_credentials
        # Expects GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (Play Console service
        # account JSON, for publishing) and the app's upload keystore vars
        # (CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS,
        # CM_KEY_ALIAS_PASSWORD) set as encrypted variables in that group —
        # see Codemagic's Android code signing docs for the exact setup.
      node: latest
      java: 21
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install npm dependencies
        script: npm ci --ignore-scripts

      - name: Build the web app (release — strips admin mode)
        script: npm run build:release

      # android/ is committed for the same reason ios/ is — see the iOS
      # workflow's comment above and .gitignore's own note.
      - name: Capacitor sync (copies www/ into android/app/src/main/assets/public + updates plugins)
        script: npx cap sync android

      - name: Set up local keystore for signing
        script: |
          echo $CM_KEYSTORE | base64 --decode > $CM_BUILD_DIR/android/app/keystore.jks
          cat >> "$CM_BUILD_DIR/android/local.properties" <<EOF
          storeFile=$CM_BUILD_DIR/android/app/keystore.jks
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_ALIAS_PASSWORD
          EOF

      - name: Build Android release AAB
        script: |
          cd android
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        # 'internal' is the safe default — promote to 'alpha'/'beta'/
        # 'production' manually once a build's been checked, not automatically
        # from every push. Also: a brand-new personal Play Console account
        # needs 12 testers for 14 days of closed testing before production
        # is even available — see STORE-SHIP-PLAN.md §6.
        track: internal
        submit_as_draft: true
